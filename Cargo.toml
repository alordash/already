[workspace]
resolver = "3"
members = [
    "src/already",
    "src/already_core",
    "src/already_proc_macro",
    "examples/simple",
    "benchmarks"
]

[workspace.dependencies]
# TODO - is there a way to specify this versions only in one place? or this is meaningless?
already = { version = "0.2.0", path = "src/already" }
already_core = { version = "0.2.0", path = "src/already_core" }
already_proc_macro = { version = "0.2.0", path = "src/already_proc_macro" }

proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.40"
syn = { version = "3.0.5", features = ["full"] }
not_enough_syntax = "0.1.6"

libloading = "0.9.0"
arc-swap = "1.9.2"
notify = "8.2.0"

rsubstitute = "0.1.6"
tempfile = "3.27.0"
dircpy = "0.3.20"
