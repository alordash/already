[workspace]
resolver = "3"
members = [
    "src/hotcode",
    "src/hotcode_core",
    "src/hotcode_proc_macro",
    "examples/simple",
    "benchmarks"
]

[workspace.dependencies]
# TODO - is there a way to specify this versions only in one place? or this is meaningless?
hotcode = { version = "0.2.0", path = "src/hotcode" }
hotcode_core = { version = "0.2.0", path = "src/hotcode_core" }
hotcode_proc_macro = { version = "0.2.0", path = "src/hotcode_proc_macro" }

proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.40"
syn = { version = "3.0.5", features = ["full"] }
not_enough_syntax = "0.1.6"

libloading = "0.9.0"
arc-swap = "1.9.2"
notify = "8.2.0"

rsubstitute = "0.1.6"
tempfile = "3.27.0"
dircpy = "0.3.20"
libc = "0.2.174"