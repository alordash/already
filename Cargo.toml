[workspace]
resolver = "3"
members = [
    "src/code_reload",
    "src/code_reload_core",
    "src/code_reload_proc_macro",
    "src/code_reload_syn_core",
    "examples/simple", ]

[workspace.dependencies]
# TODO - is there a way to specify this versions only in one place? or this is meaningless?
code_reload = { version = "0.2.0", path = "src/code_reload" }
code_reload_core = { version = "0.2.0", path = "src/code_reload_core" }
code_reload_proc_macro = { version = "0.2.0", path = "src/code_reload_proc_macro" }
code_reload_syn_core = { version = "0.2.0", path = "src/code_reload_syn_core" }

proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.40"
syn = { version = "3.0.5", features = ["full"] }
not_enough_syntax = "0.1.5"

libloading = "0.9.0"
arc-swap = "1.9.2"
notify = "8.2.0"

rsubstitute = "0.1.6"
tempfile = "3.27.0"
dircpy = "0.3.20"
